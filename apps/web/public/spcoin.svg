<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rim" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="35%" stop-color="#F6C453"/>
      <stop offset="70%" stop-color="#E3A81C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
    <radialGradient id="face" cx="42%" cy="36%" r="85%">
      <stop offset="0%" stop-color="#12703A"/>
      <stop offset="60%" stop-color="#0A5A2D"/>
      <stop offset="100%" stop-color="#063D1E"/>
    </radialGradient>
    <linearGradient id="potg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#E3A81C"/>
    </linearGradient>
    <radialGradient id="shine" cx="32%" cy="24%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- coin body -->
  <circle cx="120" cy="120" r="116" fill="url(#rim)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#8A6508" stroke-width="2" opacity="0.5"/>

  <!-- milled edge dots -->
  <g fill="#8A6508" opacity="0.55">
    <circle cx="120" cy="12"  r="2.4"/><circle cx="151" cy="16.3" r="2.4"/><circle cx="179" cy="29"  r="2.4"/>
    <circle cx="201" cy="49"  r="2.4"/><circle cx="216" cy="75"  r="2.4"/><circle cx="223" cy="104" r="2.4"/>
    <circle cx="221" cy="134" r="2.4"/><circle cx="211" cy="163" r="2.4"/><circle cx="192" cy="187" r="2.4"/>
    <circle cx="167" cy="205" r="2.4"/><circle cx="138" cy="215" r="2.4"/><circle cx="108" cy="216" r="2.4"/>
    <circle cx="79"  cy="208" r="2.4"/><circle cx="54"  cy="192" r="2.4"/><circle cx="34"  cy="169" r="2.4"/>
    <circle cx="21"  cy="141" r="2.4"/><circle cx="17"  cy="111" r="2.4"/><circle cx="22"  cy="81"  r="2.4"/>
    <circle cx="36"  cy="54"  r="2.4"/><circle cx="57"  cy="33"  r="2.4"/><circle cx="84"  cy="19"  r="2.4"/>
  </g>

  <!-- inner green face -->
  <circle cx="120" cy="120" r="88" fill="url(#face)"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="#FFE9A8" stroke-width="2" opacity="0.7"/>
  <circle cx="120" cy="120" r="82" fill="none" stroke="#B8860B" stroke-width="1" opacity="0.5"/>

  <!-- pot silhouette (embossed gold) -->
  <g transform="translate(120,104)">
    <!-- pot body -->
    <path d="M -34 -6 Q -38 26 0 30 Q 38 26 34 -6 Z" fill="url(#potg)"/>
    <!-- pot rim -->
    <rect x="-40" y="-14" width="80" height="10" rx="5" fill="url(#potg)"/>
    <!-- coins rising from the pot -->
    <circle cx="-14" cy="-24" r="7" fill="#FFE9A8"/>
    <circle cx="4"   cy="-32" r="8" fill="#F6C453"/>
    <circle cx="20"  cy="-22" r="6" fill="#FFE9A8"/>
    <!-- emboss shadow under pot -->
    <ellipse cx="0" cy="32" rx="30" ry="4" fill="#052D16" opacity="0.6"/>
  </g>

  <!-- SP monogram -->
  <text x="120" y="176" text-anchor="middle"
        font-family="Archivo, Arial Black, sans-serif" font-weight="900"
        font-size="34" fill="url(#potg)" letter-spacing="1">SP</text>

  <!-- specular highlight -->
  <ellipse cx="86" cy="66" rx="64" ry="40" fill="url(#shine)"/>
</svg>
