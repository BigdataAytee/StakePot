# StakeAm on Render — Blueprint.
#
# Four resources: Postgres, Key Value (Redis), the API, and the web app. Both
# apps deploy from their existing Dockerfiles, so what Render runs is what CI
# builds and what runs locally.
#
#   Render → New → Blueprint → pick this repo and branch.
#
# Two values are deliberately hardcoded rather than wired with `fromService`:
# the API's public URL and the web app's. Render's blueprint syntax can inject
# a *host* but cannot prepend `https://`, and both of these need a full origin —
# the API for its CORS allow-list, the web app for the address baked into its
# client bundle. Render service URLs are `https://<name>.onrender.com`, so they
# are predictable from the names below. **If you rename a service here, change
# the matching URL too.**
#
# Everything is on `free` so nothing here can surprise you with a bill. Free
# Postgres on Render expires after 30 days and free services sleep when idle —
# fine for a preview, not for anything with real money in it. See the notes at
# the bottom before this carries a real market.

databases:
  - name: stakeam-db
    databaseName: stakeam
    user: stakeam
    plan: free
    postgresMajorVersion: '16'
    # Frankfurt, not Oregon: the audience is Nigerian, and every trade is a
    # round trip to this database. Keep all four resources in one region — a
    # cross-region hop on the write path is the difference between a market
    # that feels live and one that does not.
    region: frankfurt

services:
  # ------------------------------------------------------------------ cache
  # §11's trade queue, the rate limiter and the OTP store. All three degrade
  # rather than fail without it (the queue executes inline, the limiter falls
  # back to per-node counters), but OTP delivery genuinely needs it, so Tier 1
  # verification does not work without this service.
  #
  # NOTE: Render renamed Redis to "Key Value". If your dashboard rejects
  # `type: redis`, change it to `type: keyvalue` — same fields otherwise.
  - type: redis
    name: stakeam-cache
    plan: free
    region: frankfurt
    # Reachable only from services in this Blueprint, never the open internet.
    ipAllowList: []

  # ------------------------------------------------------------------ API
  - type: web
    name: stakeam-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /health
    # Render runs a start command without a shell, so `a && b` here is not two
    # commands — it is one command whose name contains "&&", and the container
    # exits 127 having run nothing. Both steps live in the script instead: it
    # applies migrations, then execs the server. See apps/api/render-start.sh.
    dockerCommand: sh /app/apps/api/render-start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: stakeam-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: stakeam-cache
          property: connectionString
      # Generated by Render and never seen by anybody, which is what you want
      # for both: 256 bits of base64 comfortably clears the 32-character floor
      # the API enforces at boot.
      - key: JWT_SECRET
        generateValue: true
      # Deliberately a separate value from JWT_SECRET — rotating one should
      # never force rotating the other. This one opens TOTP seeds at rest, so
      # losing it locks every enrolled staff account out of their authenticator.
      - key: SECRETS_KEY
        generateValue: true
      # CORS is pinned to exactly this origin. It must match the web service's
      # URL below, scheme included.
      - key: WEB_ORIGIN
        value: https://stakeam-web.onrender.com
      # The question engine (§2.9, §2.14a). Without it, market creation and the
      # wizard's co-pilot refuse honestly — everything else works. `sync: false`
      # makes Render ask you for it rather than storing it in this file.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional integrations. Each one logs instead of sending when unset, so
      # nothing silently pretends to have delivered a message it did not.
      - key: SENTRY_DSN
        sync: false
      - key: TERMII_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  # ------------------------------------------------------------------ web
  - type: web
    name: stakeam-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Baked into the client bundle at build time — Next inlines every
      # NEXT_PUBLIC_* value, so this cannot be corrected later by the runtime
      # environment. It is passed to the Docker build as a build argument
      # (`ARG NEXT_PUBLIC_API_URL` in apps/web/Dockerfile); with the wrong value
      # here the deployed site calls the visitor's own machine and every request
      # fails while the page still renders.
      - key: NEXT_PUBLIC_API_URL
        value: https://stakeam-api.onrender.com
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
# ---------------------------------------------------------------------------
# Before this carries anything real
#
# * **Free Postgres expires after 30 days** and free services sleep when idle,
#   so the first request after a quiet spell waits for a cold start. Move both
#   services and the database to a paid plan before a launch — and note that
#   the ledger is the reason: a database that disappears takes the receipts
#   with it.
# * **Connect as a restricted role.** The ledger's append-only guarantee is a
#   `REVOKE` against the application role plus a trigger. Render's generated
#   user owns the database, and grants do not constrain a table's owner — so
#   only the trigger is protecting you here. Create a `stakeam_app` role, run
#   the migrations as the owner, and point `DATABASE_URL` at the restricted
#   role once the schema exists.
# * **Run the 10× load profile against this environment** before any event —
#   `docs/loadtest.md`. The numbers recorded there are from a single-process
#   development container, not from anything shaped like this.
# * **Nothing here is real money.** The payment and KYC integrations are stubs
#   until licensing (§9), so a deploy from this Blueprint is points-mode only.
