name: stakeam

# Default: infrastructure only. Run the apps on the host with `pnpm dev` so
# hot reload is instant.
#
#   docker compose up -d
#   pnpm migrate && pnpm dev
#
# To run everything in containers instead (checks the Dockerfiles build):
#
#   docker compose --profile apps up --build

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: stakeam
      POSTGRES_PASSWORD: stakeam
      POSTGRES_DB: stakeam
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stakeam -d stakeam']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['apps']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://stakeam:stakeam@postgres:5432/stakeam
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-32chars}
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'

  web:
    profiles: ['apps']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  redis-data:
