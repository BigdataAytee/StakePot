name: Probe deployment

# What is actually running out there.
#
# This session cannot reach onrender.com — the sandbox's network policy refuses
# it — so diagnosing a deployment meant asking for curl output and waiting a
# round trip for each question. A runner has no such restriction. Everything
# below is a public endpoint; no secrets, and nothing is written.
on:
  workflow_dispatch:
    inputs:
      web:
        description: Web app origin
        default: https://stakeam-web.onrender.com
      api:
        description: API origin
        default: https://stakeam-api.onrender.com
  # So it runs the moment it is added or changed, without waiting for
  # workflow_dispatch to be available on the default branch.
  push:
    paths: ['.github/workflows/probe-deployment.yml']

jobs:
  probe:
    name: what is live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        env:
          WEB: ${{ github.event.inputs.web || 'https://stakeam-web.onrender.com' }}
          API: ${{ github.event.inputs.api || 'https://stakeam-api.onrender.com' }}
        run: |
          set -u
          # Free instances sleep; the first request pays for a cold start.
          say() { printf '\n=== %s ===\n' "$1"; }

          say "api /health"
          curl -sS -m 90 -w '\nHTTP %{http_code} in %{time_total}s\n' "$API/health" || echo "unreachable"

          say "api / (which build)"
          curl -sS -m 60 -w '\nHTTP %{http_code}\n' "$API/" || echo "unreachable"

          say "web /version (which build)"
          curl -sS -m 90 -w '\nHTTP %{http_code}\n' "$WEB/version" || echo "unreachable"

          say "api /markets — how many, and what"
          body=$(curl -sS -m 60 "$API/markets" || echo '[]')
          echo "$body" | head -c 400; echo
          echo "markets returned: $(echo "$body" | grep -o '"id"' | wc -l)"
          echo "shelves: $(echo "$body" | grep -o '"shelf":"[a-z]*"' | sort | uniq -c | tr '\n' ' ')"

          say "web /markets — what the server sends a browser"
          page=$(curl -sS -m 90 "$WEB/markets" || echo '')
          echo "shelf chips present: $(echo "$page" | grep -c 'aria-label="Shelf"')"
          echo "'Nothing open here yet': $(echo "$page" | grep -c 'Nothing open here yet')"
          echo "seeded questions on the page: $(echo "$page" | grep -oE 'naira close below|Super Eagles|Apple Music|Premier League|headline inflation|petrol sell below' | sort -u | tr '\n' ' ')"
          echo "build-commit meta: $(echo "$page" | grep -o 'name="build-commit" content="[^"]*"' || echo 'absent — old build')"
